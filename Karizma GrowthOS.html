/* ---------- charts ---------- */
function lineChart(series,labels,w=620,h=220){
  const p={l:36,r:12,t:12,b:26},iw=w-p.l-p.r,ih=h-p.t-p.b;
  const max=Math.max(...series.flatMap(s=>s.data))*1.12||1;
  const X=i=>p.l+iw*i/(labels.length-1),Y=v=>p.t+ih-ih*v/max;
  let g='';
  for(let i=0;i<=4;i++){const v=max*i/4,y=Y(v);g+=`<line x1="${p.l}" x2="${w-p.r}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${p.l-6}" y="${y+4}" text-anchor="end">${Math.round(v)}</text>`}
  labels.forEach((l,i)=>{if(i%2===0||labels.length<8)g+=`<text x="${X(i)}" y="${h-8}" text-anchor="middle">${l}</text>`});
  let lines='';
  series.forEach(s=>{
    const d=s.data.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ');
    const area=d+` L${X(s.data.length-1)} ${p.t+ih} L${p.l} ${p.t+ih} Z`;
    lines+=`<path d="${area}" fill="${s.color}" opacity=".08"/><path class="draw" pathLength="1" d="${d}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
    s.data.forEach((v,i)=>{lines+=`<circle cx="${X(i)}" cy="${Y(v)}" r="${i===s.data.length-1?5:3}" fill="${i===s.data.length-1?s.color:'var(--surface)'}" stroke="${s.color}" stroke-width="2"><title>${s.name}, ${labels[i]}: ${v}</title></circle>`});
  });
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="Line chart">${g}${lines}</svg>`;
}
function donut(items){
  const tot=items.reduce((a,b)=>a+b.v,0)||1;let off=0,segs='';
  items.forEach((it,i)=>{const len=it.v/tot*100;segs+=`<circle r="15.915" cx="21" cy="21" fill="none" stroke="${COLORS[i%6]}" stroke-width="6" stroke-dasharray="${len} ${100-len}" stroke-dashoffset="${-off}" transform="rotate(-90 21 21)"><title>${it.n}: ${money(it.v)}</title></circle>`;off+=len});
  return `<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap"><svg viewBox="0 0 42 42" width="150" height="150" role="img" aria-label="Budget by channel">${segs}<text x="21" y="22.5" text-anchor="middle" style="font-size:5px;fill:var(--fg);font-weight:700">${money(tot)}</text></svg><div class="legend" style="flex-direction:column;gap:6px;margin:0">${items.map((it,i)=>`<span><i style="background:${COLORS[i%6]}"></i>${esc(it.n)} · ${Math.round(it.v/tot*100)}%</span>`).join('')}</div></div>`;
}
function funnel(vals,names){
  const max=Math.max(vals[0],1);
  return vals.map((v,i)=>`<div style="margin-bottom:8px"><div class="row2" style="font-size:12px"><span>${names[i]}</span><b>${v}</b></div><div class="bar" style="height:14px"><i data-w="${v/max*100}"></i></div></div>`).join('');
}

  if(S.view==='overview')ctl+=`<select id="fc" aria-label="Client"><option value="all">All clients</option>${S.clients.map(c=>`<option value="${c.id}" ${S.clientFilter===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select><select id="fp" aria-label="Reporting period">${[['7','Last 7 days'],['30','Last 30 days'],['90','Last 90 days']].map(o=>`<option value="${o[0]}" ${S.period===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select><button class="btn" data-a="export">Export report</button>`;
  ctl+=`<button class="btn icon" data-a="bell" aria-label="Notifications"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 9a6 6 0 0 1 12 0c0 6 2 7 2 7H4s2-1 2-7M10 20a2 2 0 0 0 4 0"/></svg><span class="dot"></span></button><div class="avatar" title="Agency Founder (demo)">AF</div>`;
  if(S.bell)ctl+=`<div class="pop"><b style="padding:8px;display:block">Notifications</b><ul>${S.activity.slice(0,6).map(a=>`<li>${esc(a.x)}<time class="meta" style="display:block">${a.t}</time></li>`).join('')}</ul></div>`;
  $('#ctl').innerHTML=ctl;
  const m=$('#main');m.innerHTML=VIEWS[S.view]();
  m.style.animation='none';m.offsetHeight;m.style.animation='';
  requestAnimationFrame(()=>{
    m.querySelectorAll('[data-n]').forEach(el=>countUp(el));
    m.querySelectorAll('.bar i[data-w]').forEach(el=>{el.style.width=el.dataset.w+'%'});
  });
  renderLayer();
}
function countUp(el){
  const n=+el.dataset.n,u=el.dataset.u;const fmt=v=>u==='$'?money(v):u==='%'?v.toFixed(1)+'%':Math.round(v).toLocaleString('en-US');
  if(RM){el.textContent=fmt(n);return}
  const t0=performance.now(),D=900;
  (function step(t){const p=Math.min(1,(t-t0)/D),e=1-Math.pow(1-p,3);el.textContent=fmt(n*e);if(p<1)requestAnimationFrame(step)})(t0);
}
function toast(x){const d=document.createElement('div');d.className='toast';d.textContent=x;$('#toasts').appendChild(d);setTimeout(()=>d.remove(),2800)}
function copy(text,msg){
  const done=()=>toast(msg);
  const fb=()=>{const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}ta.remove();done()};
  try{navigator.clipboard.writeText(text).then(done,fb)}catch(e){fb()}
}

    case 'generate':readAI();generate('Generate a campaign plan');break;
    case 'save':{const r=S.chat.find(m=>m.i==id)?.r;if(r){S.saved.push(r.headlines[0]);toast('Idea saved');render()}break}
    case 'brief':{const r=S.chat.find(m=>m.i==id)?.r;if(r){copy(`CAMPAIGN BRIEF (simulated draft)\n\nStrategy: ${r.strategy}\n\nActions:\n- ${r.actions.join('\n- ')}\n\nStructure:\n- ${r.structure.join('\n- ')}\n\nNext steps:\n- ${r.next.join('\n- ')}`,'Campaign brief copied')}break}
    case 'convert':{const m=S.chat.find(m=>m.i==id);S.aiClientPre=m.f.client;MODALS.campaign({name:(m.f.business||'New')+' growth campaign',budget:'5000',client:m.f.client});break}
    case 'cal':{const m=S.chat.find(m=>m.i==id);S.content.push({id:nid('t'),title:m.r.ideas[0].replace(/"/g,''),client:m.f.client,channel:m.f.channel==='Email Marketing'?'Email':'Instagram',date:'2026-11-30',status:'Client Review',fb:''});log('Content scheduled for review: '+m.r.ideas[0]);toast('Added to the content calendar and the client portal');render();break}
  }
});
function readAI(){const g=i=>($('#a_'+i)?.value||'').trim();S.aiForm={business:g('business'),service:g('service'),audience:g('audience'),objective:g('objective'),channel:g('channel'),client:g('client')}}
let aiN=0;
function generate(label){
  if(S.typing)return;
  const f={...S.aiForm};
  S.history.unshift(label+(f.business?': '+f.business:''));S.history=S.history.slice(0,6);
  S.chat.push({role:'u',text:`${label}${f.business?' for '+f.business:''}${f.audience?' targeting '+f.audience:''}`});
  S.typing=true;render();
  setTimeout(()=>{S.typing=false;const i=++aiN;S.chat.push({role:'a',r:aiResponse(f),f,i});render()},RM?50:1300);
}
document.addEventListener('input',e=>{
  if(e.target.id==='cq'){S.cq=e.target.value;const p=e.target.selectionStart;render();const n=$('#cq');n.focus();n.setSelectionRange(p,p)}
  if(e.target.id==='kq'){S.kq=e.target.value;const p=e.target.selectionStart;render();const n=$('#kq');n.focus();n.setSelectionRange(p,p)}
  if(e.target.id==='lq'){S.lq=e.target.value;const p=e.target.selectionStart;render();const n=$('#lq');n.focus();n.setSelectionRange(p,p)}
});
document.addEventListener('change',e=>{
  const id=e.target.id,v=e.target.value;
  if(id==='fc'){S.clientFilter=v;render()}
  else if(id==='fp'){S.period=v;toast('Showing demo data for the selected period');}
  else if(id==='pc'){S.portalClient=v;render()}
  else if(id==='rp'){S.reportPeriod=v;render()}
  else if(id==='d_status'){const c=S.clients.find(x=>x.id===S.drawer.id);c.status=v;log(`${c.name} status set to ${v}`);render();redrawDrawer()}
  else if(id==='d_mgr'){const c=S.clients.find(x=>x.id===S.drawer.id);c.mgr=v;log(`${c.name} assigned to ${v}`);render();redrawDrawer()}
  else if(id==='d_cstatus'){const c=S.campaigns.find(x=>x.id===S.drawer.id);c.status=v;log(`${c.name} status set to ${v}`);render();redrawDrawer()}
  else if(id==='d_cmgr'){const c=S.campaigns.find(x=>x.id===S.drawer.id);c.mgr=v;log(`${c.name} assigned to ${v}`);render();redrawDrawer()}
  else if(id==='d_lstage'){const l=S.leads.find(x=>x.id===S.drawer.id);l.stage=+v;log(`Lead ${l.name} moved to ${LSTAGES[+v]}`);render();redrawDrawer()}
  else if(id==='d_lowner'){const l=S.leads.find(x=>x.id===S.drawer.id);l.owner=v;toast('Owner updated');}
  else if(id==='d_lfollow'){const l=S.leads.find(x=>x.id===S.drawer.id);l.follow=v;toast('Follow-up scheduled for '+v)}
});
let dragId=null;
document.addEventListener('dragstart',e=>{const c=e.target.closest?.('.lead');if(c){dragId=c.dataset.id;c.classList.add('drag');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',dragId)}});
document.addEventListener('dragend',e=>{e.target.classList?.remove('drag');document.querySelectorAll('.col.over').forEach(c=>c.classList.remove('over'))});
document.addEventListener('dragover',e=>{const c=e.target.closest?.('.col');if(c){e.preventDefault();document.querySelectorAll('.col.over').forEach(x=>x!==c&&x.classList.remove('over'));c.classList.add('over')}});
document.addEventListener('drop',e=>{const c=e.target.closest?.('.col');if(!c||!dragId)return;e.preventDefault();const l=S.leads.find(x=>x.id===dragId);const st=+c.dataset.stage;if(l.stage!==st){l.stage=st;log(`Lead ${l.name} moved to ${LSTAGES[st]}`);toast(`${l.name} moved to ${LSTAGES[st]}`)}dragId=null;render()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(S.modal){S.modal=null;renderLayer()}else if(S.drawer){S.drawer=null;renderLayer()}else if(S.bell){S.bell=false;render()}}});

render();
setTimeout(()=>{S.loading=false;if(S.view==='overview')render()},RM?0:650);
</script>

</body></html>
